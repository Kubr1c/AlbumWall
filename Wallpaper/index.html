<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlbumWall v3</title>
<link rel="preload" as="image" href="flip-background.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0b}
body{display:grid;place-items:center}#wall{position:relative;display:grid;justify-content:center;align-content:center}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,var(--edge-fade,0)) 100%)}
.line-window{position:absolute;overflow:hidden;z-index:4;background:#090a0b;pointer-events:none}.line-track{position:absolute;display:flex;will-change:transform}.line-cell{position:relative;flex:none;padding:calc(var(--gap,2px)/2)}.line-cell img{display:block;width:100%;height:100%;object-fit:cover}
.slide-out{position:absolute;z-index:3;overflow:hidden;pointer-events:none;will-change:transform}.slide-out img{display:block;width:100%;height:100%;object-fit:cover}
.tile{position:relative;perspective:1100px;overflow:hidden;isolation:isolate}.card{position:absolute;inset:calc(var(--gap,2px)/2);transform-style:preserve-3d}
.tile::before{content:"";position:absolute;inset:calc(var(--gap,2px)/2);z-index:0;pointer-events:none;background:#ffcb2d url("flip-background.png") center / contain no-repeat}
.card{z-index:1}
.flip-panel{position:absolute;inset:calc(var(--gap,2px)/2);z-index:2;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform;background:#111}.flip-panel img{display:block;width:100%;height:100%;object-fit:cover}
.card.push{overflow:hidden;transform-style:flat}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#111}
.settled-cover{position:absolute;inset:calc(var(--gap,2px)/2);z-index:3;overflow:hidden;background:#111;pointer-events:none}.settled-cover img{display:block;width:100%;height:100%;object-fit:cover}
.face img{display:block;width:100%;height:100%;object-fit:cover}.back{transform:rotateY(180deg)}
.card.vertical.flip3d .back{transform:rotateX(180deg)}
.card.moving{will-change:transform;transition:transform var(--duration,870ms) cubic-bezier(.42,.02,.21,.99)}
.card.moving.flip3d.horizontal{transform:rotateY(180deg)}.card.moving.flip3d.vertical{transform:rotateX(180deg)}
#hover-layer{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 380ms ease-out}
#hover-ring{position:fixed;z-index:0;pointer-events:none;visibility:hidden;transform-origin:center;border:2px solid rgba(255,255,255,.9);animation:hover-breathe 2.8s ease-in-out infinite}@keyframes hover-breathe{0%,100%{box-shadow:inset 0 0 8px rgba(255,255,255,.2);opacity:.45}50%{box-shadow:inset 0 0 23px rgba(255,255,255,.5);opacity:1}}
#status{color:#bbb;font:14px/1.7 system-ui;text-align:center;position:fixed;bottom:18px;pointer-events:none}
#toast{color:#fff;font:14px/1.5 system-ui;text-align:center;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 14px;border-radius:18px;background:rgba(0,0,0,.72);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
</style></head><body><main id="wall" aria-label="专辑封面墙"></main><div id="status"></div>
<div id="toast" aria-live="polite"></div><div id="hover-layer" aria-hidden="true"><div id="hover-ring"></div></div>
<script src="covers.js"></script><script>
(()=>{'use strict';
const wall=document.getElementById('wall'),status=document.getElementById('status'),toast=document.getElementById('toast');
const config={rows:5,interval:2800,duration:870,gap:2,transitionRatio:.25,quiet:false,edgeFade:0,direction:'random',effect:'randomAll'};
let source=[],tiles=[],paused=false,timer,revision='',folder='',generation=0,resizeTimer;
const directory=new Map(),reserved=new Set(),bad=new Set(),lastShown=new Map();
let sequence=0,lastTile=null,roundRunning=false;
const hoverRing=document.getElementById('hover-ring'),hoverLayer=document.getElementById('hover-layer'),activeAnimations=new Set();
function trackAnimation(animation,participants){

 return animation;
}
function hoverTile(t,hovered){
 t.hovered=hovered;
 // Keep one permanent overlay; never reparent or restart its breathing clock.

}
let hoverFrame=0;
function drawHoverRing(){

 let t=hoveredTile;if(!t||!t.tile.isConnected){hoverRing.style.visibility='hidden';return;}

  (t.pushAnimations?.length&&(hoverTarget===t.front||hoverTarget===t.back))||hoverTarget===t.slideAnimation?.effect?.target);
 if(!active){
  if(hoverCover){
   const destination=tiles.find(candidate=>candidate.url===hoverCover);
   if(!destination){clearHover();return;}
   if(destination!==t){t.hovered=false;destination.hovered=true;hoveredTile=destination;t=destination;}
   hoverCover=null;
  }

 }

 // A translating face must not expose its outline outside the tile window.

 const clip=clipHost?clipHost.getBoundingClientRect():{left:0,top:0,right:innerWidth,bottom:innerHeight};

// Desktop web hosts may forward legacy mouse events without Pointer Events.
// Resolve the grid from coordinates so animated overlays cannot steal hover.
let hoveredTile=null,hoverTarget=null,hoverCover=null,lastPointer=null,hoverRevealTimer;
function updateHover(event){

 const rect=wall.getBoundingClientRect(),size=tiles[0]?.tile.offsetWidth;
 const cols=Number(wall.style.gridTemplateColumns.match(/repeat\((\d+)/)?.[1])||0;
 const col=Math.floor((event.clientX-rect.left)/size),row=Math.floor((event.clientY-rect.top)/size);
 let next=size&&col>=0&&col<cols&&row>=0&&event.clientY<rect.bottom?tiles[row*cols+col]||null:null;

 // Lock immediately, but reveal only after a short dwell to ignore fly-by movement.

 }

 // Preserve the identity of the moving artwork across its destination commit.
 hoverCover=target&&target!==next?.tile?(target===next.flipPanel?next.second.src:target.querySelector('img')?.src||next.url):null;

  clearTimeout(hoverRevealTimer);
  hoverLayer.style.transition='none';hoverLayer.style.opacity='0';
  hoverLayer.getBoundingClientRect();hoverLayer.style.transition='opacity 380ms ease-out';
  if(next)hoverRevealTimer=setTimeout(()=>{if(hoveredTile)hoverLayer.style.opacity='1';},80);
  if(hoveredTile)hoverTile(hoveredTile,false);
  hoveredTile=next;
  if(next)hoverTile(next,true);
 }else if(next)drawHoverRing();
 if(!next)hoverRing.style.visibility='hidden';

}
function clearHover(){clearTimeout(hoverRevealTimer);hoverLayer.style.opacity='0';if(hoveredTile)hoverTile(hoveredTile,false);hoveredTile=null;hoverTarget=null;hoverCover=null;lastPointer=null;cancelAnimationFrame(hoverFrame);hoverFrame=0;hoverRing.style.visibility='hidden';}

addEventListener('pointermove',updateHover,{passive:true});
addEventListener('blur',clearHover);
document.documentElement.addEventListener('mouseleave',clearHover);
function appearance(){
 document.documentElement.style.setProperty('--gap',config.gap+'px');
 document.documentElement.style.setProperty('--edge-fade',(config.edgeFade/100*.72).toFixed(2));
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const basename=url=>decodeURIComponent(url.split('/').pop().split('?')[0]);
const fileUrl=p=>p.startsWith('file:')?p:'file:///'+p.replace(/\\/g,'/').split('/').map((s,i)=>i===0?s:encodeURIComponent(s)).join('/');
function shuffled(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 const library=window.albumWallLibrary||{files:[],revision:''};
 const allowed=new Set(library.files.map(basename));
 let next=library.files.map(p=>new URL(p,document.baseURI).href);
 if(directory.size){const selected=[...directory.entries()].filter(([name])=>allowed.has(basename(name))).map(([,url])=>url);if(selected.length)next=selected;}
 next=[...new Set(next)].filter(p=>!bad.has(p));

function makeTile(url){

 const card=document.createElement('div');card.className='card';
 const front=document.createElement('div'),back=document.createElement('div');front.className='face';back.className='face back';
 const first=new Image(),second=new Image();first.alt=second.alt='';first.decoding=second.decoding='async';first.src=second.src=url;
 first.onerror=()=>{bad.add(first.src);applyLibrary()};
 front.append(first);back.append(second);card.append(front,back);tile.append(card);wall.append(tile);

function render(){
 for(const entry of activeAnimations)entry.animation.cancel();activeAnimations.clear();hoverRing.style.visibility='hidden';
 hoveredTile=null;hoverTarget=null;hoverCover=null;lastPointer=null;generation++;reserved.clear();wall.replaceChildren();tiles=[];
 if(!source.length){status.textContent='暂无可用专辑封面 · 请运行 update.cmd';return}
 status.textContent='';
 let rows=Math.min(config.rows,source.length);
 const size=Math.max(1,Math.floor(innerHeight/rows));
 // Match the former edge-to-edge wall: center a slightly oversized grid so
 // partial outer tiles fill the left/right edges instead of leaving margins.
 let cols=Math.ceil(innerWidth/size)+1;

 wall.style.width=`${cols*size}px`;wall.style.height=`${rows*size}px`;
 document.documentElement.style.setProperty('--gap',config.gap+'px');document.documentElement.style.setProperty('--duration',config.duration+'ms');
 document.documentElement.style.setProperty('--edge-fade',(config.edgeFade/100*.72).toFixed(2));

 for(const t of tiles)lastShown.set(t.url,++sequence);lastTile=null;
}
const painted=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

 // Chromium's compositor. Swap decoded images only while the panel is edge-on.

 if(token!==generation||!t.tile.isConnected)return;
 panel.append(outgoing);t.tile.append(panel);t.flipPanel=panel;
 await painted();
 if(token!==generation||!t.tile.isConnected)return;

 const rotate=angle=>`${direction==='vertical'?'rotateX':'rotateY'}(${angle}deg)`;
 const first=panel.animate([{transform:rotate(0)},{transform:rotate(90)}],{duration:duration/2,easing:'ease-in',fill:'both'});
 t.flipAnimation=first;trackAnimation(first,[t]);await first.finished;

 const second=panel.animate([{transform:rotate(-90)},{transform:rotate(0)}],{duration:duration/2,easing:'ease-out',fill:'both'});

 if(token!==generation||!t.tile.isConnected)return;
 t.first.src=next;await t.first.decode();
 if(token!==generation||!t.tile.isConnected)return;

}
async function settleFlip(t,next,token){

 // while the card returns to its neutral orientation.

 await painted();
 if(token!==generation||!t.tile.isConnected)return;
 t.first.src=next;await t.first.decode();
 if(token!==generation||!t.tile.isConnected)return;

 t.pushAnimations?.forEach(animation=>animation.cancel());t.pushAnimations=null;
 t.front.style.transform='';t.back.style.transform='';t.card.classList.remove('push');

async function flip(effectOverride){

  const cols=Number(wall.style.gridTemplateColumns.match(/repeat\((\d+)/)?.[1])||1;
  candidates=candidates.map(({tile})=>{
   const i=tiles.indexOf(tile),exits=[];
   if(i%cols>0)exits.push({direction:'left',tile:tiles[i-1]});
   if(i%cols<cols-1&&tiles[i+1])exits.push({direction:'right',tile:tiles[i+1]});
   if(i-cols>=0)exits.push({direction:'up',tile:tiles[i-cols]});

   const allowed=config.direction==='horizontal'?['left','right']:config.direction==='vertical'?['up','down']:['left','right','up','down'];

 const next=leastSeen[Math.floor(Math.random()*leastSeen.length)],token=generation,duration=config.duration;
 lastTile=t;
 const direction=config.direction==='random'?(Math.random()<.5?'horizontal':'vertical'):config.direction;
 const slideDirection=exit?.direction||(config.direction==='random'?['left','right','up','down'][Math.floor(Math.random()*4)]:direction==='horizontal'?(['left','right'][Math.floor(Math.random()*2)]):(['up','down'][Math.floor(Math.random()*2)]));

   Object.assign(old.style,{left:(from.left-wallRect.left+inset)+'px',top:(from.top-wallRect.top+inset)+'px',width:(from.width-config.gap)+'px',height:(from.height-config.gap)+'px'});

async function slideLine(axis){
 if(paused||document.hidden||!tiles.length)return;
 const token=generation,duration=config.duration;
 const cols=wall.style.gridTemplateColumns.match(/repeat\((\d+)/)?.[1];
 const columnCount=Number(cols)||Math.round(parseFloat(wall.style.width)/tiles[0].tile.offsetWidth);
 const rowCount=tiles.length/columnCount,horizontal=axis==='row';
 const groups=Array.from({length:horizontal?rowCount:columnCount},(_,i)=>tiles.filter((_,j)=>horizontal?Math.floor(j/columnCount)===i:j%columnCount===i)).filter(group=>group.length&&group.every(t=>!t.busy&&!t.hovered)&&group.some(t=>{const r=t.tile.getBoundingClientRect();return r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight}));
 if(!groups.length)return;
 const group=groups[Math.floor(Math.random()*groups.length)];
 const visible=new Set(tiles.map(t=>t.url));
 const free=source.filter(url=>!visible.has(url)&&!reserved.has(url));
 if(!free.length)return;
 const oldest=Math.min(...free.map(url=>lastShown.get(url)||0));
 const next=shuffled(free.filter(url=>(lastShown.get(url)||0)===oldest))[0];
 const forward=Math.random()<.5,previous=group.map(t=>t.url);
 const updated=forward?[next,...previous.slice(0,-1)]:[...previous.slice(1),next];
 const ordered=forward?[next,...previous]:[...previous,next];
 const size=group[0].tile.offsetWidth;
 const viewport=document.createElement('div'),track=document.createElement('div');
 viewport.className='line-window';track.className='line-track';
 Object.assign(viewport.style,{left:group[0].tile.offsetLeft+'px',top:group[0].tile.offsetTop+'px',width:(horizontal?size*group.length:size)+'px',height:(horizontal?size:size*group.length)+'px'});
 track.style.flexDirection=horizontal?'row':'column';
 const images=ordered.map(url=>{const cell=document.createElement('div'),img=new Image();cell.className='line-cell';cell.style.width=cell.style.height=size+'px';img.src=url;cell.append(img);track.append(cell);return img});
 group.forEach(t=>t.busy=true);reserved.add(next);
 let animation;
 try{
  let timeout;
  try{await Promise.race([Promise.all(images.map(img=>img.decode())),new Promise((_,reject)=>timeout=setTimeout(()=>reject(Error('decode timeout')),10000))])}finally{clearTimeout(timeout)}
  if(token!==generation||paused||!group[0].tile.isConnected)return;
  viewport.append(track);wall.append(viewport);
  group.forEach((t,i)=>{t.hoverSurface=images[i+(forward?1:0)].parentElement;});
  const translate=n=>horizontal?`translate3d(${n}px,0,0)`:`translate3d(0,${n}px,0)`;
  animation=track.animate([{transform:translate(forward?-size:0)},{transform:translate(forward?0:-size)}],{duration,easing:'cubic-bezier(.42,.02,.21,.99)',fill:'both'});
  trackAnimation(animation,group);await animation.finished;
  if(token!==generation||!group[0].tile.isConnected)return;
  // Decode replacement faces beneath the fully painted line before uncovering.
  await Promise.all(group.map(async(t,i)=>{t.first.src=t.second.src=updated[i];await Promise.all([t.first.decode(),t.second.decode()])}));
  if(token!==generation||!group[0].tile.isConnected)return;
  group.forEach((t,i)=>{t.url=updated[i]});lastShown.set(next,++sequence);
  await painted();
 }catch(e){/* Retain the original line if a new cover cannot be decoded. */}
 finally{animation?.cancel();viewport.remove();reserved.delete(next);group.forEach(t=>{t.busy=false;t.hoverSurface=null;})}
}
async function tick(manual=false){
 if(roundRunning||paused||document.hidden||(!manual&&config.quiet))return;
 clearTimeout(timer);roundRunning=true;
 // Scale the movement budget to the currently rendered grid, with a little
 // variation each round. In all-random mode a line is optional, never forced.
 const allRandom=config.effect==='randomAll';
 const tilesOnScreen=tiles.filter(t=>t.tile.isConnected).length;
 let count=Math.max(1,Math.min(tilesOnScreen,Math.round(tilesOnScreen*config.transitionRatio*(.65+Math.random()*.7))));
 let selected=config.effect;
 if(allRandom)selected=Math.random()<.4?(Math.random()<.5?'rowSlide':'columnSlide'):'random';
 const lineAxis=selected==='rowSlide'?'row':selected==='columnSlide'?'column':null;
 let lineCount=0,lineLength=0;
 if(lineAxis){
  const cols=Number(wall.style.gridTemplateColumns.match(/repeat\((\d+)/)?.[1])||1;
  const rows=Math.max(1,Math.floor(tilesOnScreen/cols));
  lineLength=lineAxis==='row'?cols:rows;
  const available=lineAxis==='row'?rows:cols;
  if(allRandom)count=Math.min(tilesOnScreen,Math.max(count,lineLength+1));
  lineCount=Math.min(available,Math.max(1,Math.round(count*.5/lineLength)));
  if(allRandom)lineCount=Math.min(lineCount,Math.max(0,Math.floor((count-1)/lineLength)));
 }
 const singleCount=Math.max(0,count-lineCount*lineLength);
 const effects=[];
 while(effects.length<singleCount)effects.push(...shuffled(['flip3d','slide','push','slideOut']));
 try{
  const jobs=[];
  if(lineAxis)jobs.push(...Array.from({length:lineCount},()=>slideLine(lineAxis)));
  if(allRandom||selected==='random')jobs.push(...Array.from({length:singleCount},(_,i)=>flip(effects[i])));
  else if(!lineAxis)jobs.push(...Array.from({length:singleCount},()=>flip(selected)));
  await Promise.all(jobs);
 }
 finally{roundRunning=false;start()}
}
function start(){clearTimeout(timer);if(!roundRunning&&!paused&&!config.quiet&&!document.hidden)timer=setTimeout(()=>tick(),config.interval)}
let toastTimer;
function showToast(message){toast.textContent=message;toast.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity='0',1800)}
addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.code==='KeyQ'){config.quiet=!config.quiet;start();showToast(config.quiet?'安静模式已开启（按 Q 恢复自动切换）':'安静模式已关闭');return;}
 if(e.code==='Space'){e.preventDefault();tick(true);}
});
window.albumWallLibraryUpdated=applyLibrary;
window.wallpaperPropertyListener={
 applyUserProperties(p){
  let rebuild=false;
  for(const [key,min,max] of [['rows',1,12],['interval',500,10000],['duration',300,1800],['gap',0,12],['edgeFade',0,100]]){
   if(p[key]){const v=Number(p[key].value);if(Number.isFinite(v)){const next=Math.round(clamp(v,min,max));if(key==='rows'&&next!==config.rows)rebuild=true;config[key]=next;}}
  }
  if(p.transitionRatio){const value=Number(p.transitionRatio.value);if(Number.isFinite(value))config.transitionRatio=clamp(value,5,60)/100;}
  if(p.quietMode){const value=p.quietMode.value;config.quiet=value===true||value===1||String(value).toLowerCase()==='true';}
  if(p.flipDirection){
   const value=String(p.flipDirection.value),modes={
    horizontalFlip:['horizontal','flip3d'],verticalFlip:['vertical','flip3d'],
    horizontalSlide:['horizontal','slide'],verticalSlide:['vertical','slide'],slideRandom:['random','slide'],
    random:['random','slide'],randomMix:['random','random'],
    0:['horizontal','flip3d'],1:['vertical','flip3d'],2:['random','slide']
   };
   [config.direction,config.effect]=modes[value]||['horizontal','flip3d'];
  }
  if(p.transitionEffect&&['flip3d','slide','push','slideOut','random','rowSlide','columnSlide','randomAll'].includes(p.transitionEffect.value))config.effect=p.transitionEffect.value;
  if(p.transitionDirection&&['horizontal','vertical','random'].includes(p.transitionDirection.value))config.direction=p.transitionDirection.value;
  if(p.albumfolder&&p.albumfolder.value!==folder){folder=p.albumfolder.value||'';directory.clear();applyLibrary()}
  appearance();if(rebuild)render();start();
 },
 userDirectoryFilesAddedOrChanged(name,files){if(name!=='albumfolder')return;for(const file of files)directory.set(file,fileUrl(file));applyLibrary()},
 userDirectoryFilesRemoved(name,files){if(name!=='albumfolder')return;for(const file of files)directory.delete(file);applyLibrary()},
 setPaused(value){paused=value;start()}
};
